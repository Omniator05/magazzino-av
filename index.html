    <style>html { background: #f5f5f3; } html[data-theme="dark"] { background: #121211; }</style>
    <script>
      // Tema scelto dall'utente (src/utils/theme.js): applicato prima del primo paint.
      (function () {
        try {
          var p = localStorage.getItem('rcTheme');
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var t = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#121211' : '#f5f5f3');
        } catch (e) {}
      })();
    </script>
